<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zveceditor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      canvas {
        display: block;
        touch-action: none; /* the page handles the pointer itself */
        cursor: crosshair;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 8px;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #222;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #ccc;
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <pre id="hud"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
